  @if (filterFormConfig()) {
  <div class="signal-grid-filter">
    <form [formGroup]="filterFormGroup" (ngSubmit)="onFilterSubmit()">
      <div class="signal-grid-filter__fields">
        <formly-form [model]="filterModel" [fields]="filterFormConfig()!.fields" [form]="filterFormGroup"></formly-form>
      </div>
      <div class="signal-grid-filter__actions">
        <button mat-button color="primary" type="submit" [disabled]="!filterFormGroup.valid">
          {{ filterFormConfig()!.submitBtnText || 'Apply' }}
        </button>
        @if (filterFormConfig()!.showReset !== false) {
        <button mat-button color="accent" type="button" (click)="onFilterReset()">
          {{ filterFormConfig()!.resetBtnText || 'Reset' }}
        </button>
        }
      </div>
    </form>
  </div>
  }
  @if (editable()) {
  <div class="signal-grid-save-bar" [class.has-changes]="hasUnsavedChanges()">
    <button
      mat-button
      color="primary"
      (click)="save()"
      [disabled]="!hasUnsavedChanges() || !isFormValid()">
      Save
    </button>
    <button
      mat-button
      color="accent"
      (click)="reset()"
      [disabled]="!hasUnsavedChanges()">
      Reset
    </button>
  </div>
  }
  <div class="div-table">
  <div
    lib-row
    [style.grid-template-columns]="gridTemplateColumns()"
    class="div-row"
    [formGroup]="formGroup"
    [columns]="columns()"
    [includeRowExpander]="showRowExpander()"
    [isHeaderRow]="true"
    [columnWidths]="columnWidthMap()"
    [rowExpanderConfig]="rowExpanderConfig()"
    (resizeStart)="startResize($event)"></div>
  <cdk-virtual-scroll-viewport [itemSize]="40" class="grid-viewport">
    <ng-container *cdkVirtualFor="let row of model(); index as i; trackBy: trackByIndex">
      <div
        lib-row
        class="div-row"
        [class.div-row--alt]="i % 2 !== 0"
        [style.grid-template-columns]="gridTemplateColumns()"
        [index]="i"
        [formGroup]="formGroup"
        [columns]="columns()"
        [includeRowExpander]="showRowExpander()"
        [columnWidths]="columnWidthMap()"
        [rowData]="row"
        [rowExpanderConfig]="rowExpanderConfig()"
        (rowExpanderChange)="onRowExpanderChange(i, $event)"></div>
    </ng-container>
  </cdk-virtual-scroll-viewport>
</div>
